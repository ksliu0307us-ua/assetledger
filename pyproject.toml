[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assetledger"
version = "0.1.0"
description = "Offline file inventories, comparisons, and duplicate-content reports"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "ksliu0307us-ua", email = "ksliu0307.us@gmail.com" },
]
dependencies = []

[project.scripts]
assetledger = "assetledger.cli:main"

[tool.setuptools]
packages = ["assetledger"]
